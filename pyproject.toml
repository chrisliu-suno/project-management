[project]
name = "spine"
version = "0.1.0"
description = "Carries project context across agent sessions so the goal, the plan, and the standing rules arrive on their own."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
spine = "spine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
